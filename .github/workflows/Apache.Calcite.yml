name: calcite-dotnet

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish this build to nuget.org, creating the GitHub release if one does not exist.
        type: boolean
        default: false
  push:
    branches:
    - main
    - develop
  pull_request:
    branches:
    - main
    - develop
  release:
    types:
    - created

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout Source
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
        submodules: recursive
    - name: Setup .NET 9.0
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 9.0.x
    - name: Setup .NET 10.0
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Install GitVersion
      uses: gittools/actions/gitversion/setup@v4
      with:
        versionSpec: 6.x
    - name: Execute GitVersion
      uses: gittools/actions/gitversion/execute@v4
    - name: Add NuGet Source (GitHub)
      shell: pwsh
      run: dotnet nuget add source --username USERNAME --password $env:GITHUB_TOKEN --store-password-in-clear-text --name ${{ github.repository_owner }} $env:GITHUB_REPOS
      env:
        GITHUB_REPOS: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: NuGet Restore
      run: dotnet restore Apache.Calcite.slnx
    - name: Build
      run: |
        dotnet msbuild /m /bl \
          /p:Configuration="Release" \
          /p:Platform="Any CPU" \
          /p:PreReleaseLabel=${GitVersion_PreReleaseLabel} \
          /p:PreReleaseNumber=${GitVersion_WeightedPreReleaseNumber} \
          /p:Version=${GitVersion_FullSemVer} \
          /p:AssemblyVersion=${GitVersion_AssemblySemVer} \
          /p:InformationalVersion=${GitVersion_InformationalVersion} \
          /p:FileVersion=${GitVersion_AssemblySemFileVer} \
          /p:PackageVersion=${GitVersion_FullSemVer} \
          /p:RepositoryUrl="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" \
          /p:PackageProjectUrl="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
          /p:BuildInParallel=true \
          /p:ContinuousIntegrationBuild=true \
          Apache.Calcite.dist.msbuildproj
    - name: Upload MSBuild Log
      if: ${{ always() }}
      uses: actions/upload-artifact@v7
      with:
        name: msbuild.binlog
        path: msbuild.binlog
    - name: Upload NuGet Packages
      uses: actions/upload-artifact@v7
      with:
        name: nuget
        path: dist/nuget
    - name: Package Tests
      run: tar czvf tests.tar.gz tests
      working-directory: dist
    - name: Upload Tests
      uses: actions/upload-artifact@v7
      with:
        name: tests
        path: dist/tests.tar.gz
  test:
    strategy:
      # One suite failing says nothing about the others, and the default cancels them: the two DELETE
      # tests red against the 1.43 snapshot were taking down all fifty jobs, so no convention test ever ran.
      fail-fast: false
      matrix:
        run:
        - Apache.Calcite.Tests
        - Apache.Calcite.Adapter.AdoNet.Tests
        - Apache.Calcite.Data.Tests
        sys:
        - win-x64
        - linux-x64
        - linux-arm64
        - osx-x64
        - osx-arm64
        tfm:
        - net8.0
        - net10.0
    name: Test (${{ matrix.run }}:${{ matrix.tfm }}:${{ matrix.sys }})
    needs:
    - build
    runs-on: ${{ fromJSON('{"win-x86":["windows-2022"],"win-x64":["windows-2022"],"linux-x64":["ubuntu-24.04"],"linux-arm64":["ubuntu-24.04-arm"],"osx-x64":["macos-15-intel"],"osx-arm64":["macos-15"]}')[matrix.sys] }}
    steps:
    - name: Setup .NET 9.0
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 9.0.x
    - name: Setup .NET 10.0
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Add NuGet Source (GitHub)
      shell: pwsh
      run: dotnet nuget add source --username USERNAME --password $env:GITHUB_TOKEN --store-password-in-clear-text --name ${{ github.repository_owner }} $env:GITHUB_REPOS
      env:
        GITHUB_REPOS: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Download Tests
      uses: actions/download-artifact@v8
      with:
        name: tests
    - name: Restore Tests
      run: tar xzvf tests.tar.gz
    - name: Execute Tests
      timeout-minutes: 480
      shell: pwsh
      run: |
        # assign powershell variables
        $run = "${{ matrix.run }}"
        $tfm = "${{ matrix.tfm }}"
        $sys = "${{ matrix.sys }}"

        # suite name can contain filter expression after ?
        $split = $run.IndexOf("?")
        if ($split -gt -1) {
            $tst = $run.Substring(0, $split)
            $qry = $run.Substring($split + 1)
        } else {
            $tst = $run
        }

        # scan and process test assemblies
        $tests = $(gi .\tests\$tst\$tfm\*.Tests.dll)
        if ($tests) {
            $argl = @(
                "-f", $tfm,
                "-v:diag",
                "--results-directory", "TestResults",
                "--logger:console;verbosity=diag",
                "--logger:trx"
            )
            
            $runsettings = $(gi .\tests\$tst\$tfm\*.runsettings)
            if ($runsettings) {
                $argl += "--settings:$runsettings"
            }

            if ($qry -ne "" -and $qry -ne $null) {
                $argl += @("--filter", $qry)
                Add-Content $env:GITHUB_ENV "`nRET=TestResults--$tst-$qry--$tfm--$sys"
            } else {
                Add-Content $env:GITHUB_ENV "`nRET=TestResults--$tst--$tfm--$sys"
            }
            
            dotnet test @argl $tests[0].FullName
        }
    - name: Archive Test Results
      if: always() && startsWith(env.RET, 'TestResults--')
      run: tar czvf TestResults.tar.gz TestResults
    - name: Upload Test Results
      if: always() && startsWith(env.RET, 'TestResults--')
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.RET }}
        path: TestResults.tar.gz
  release:
    name: Release
    if: github.event_name != 'pull_request'
    needs:
    - test
    runs-on: ubuntu-latest
    env:
      # One switch for the GitHub release and the nuget.org push together, so a build cannot reach one
      # and not the other. main carries it by default: only a push from the run that built the package
      # puts the same assembly on both feeds, and a later run cannot, because GitHub Packages already
      # holds the version and skips it as a duplicate. The workflow_dispatch input forces the same pair
      # from any ref, for a branch that does not publish on its own or to retry a run that failed here.
      PUBLISH: ${{ github.ref_type == 'tag' || github.ref == 'refs/heads/main' || inputs.publish == true }}
    steps:
    - name: Checkout Source
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Setup .NET 10.0
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Install GitVersion
      uses: gittools/actions/gitversion/setup@v4
      with:
        versionSpec: 6.x
    - name: Execute GitVersion
      id: GitVersion
      uses: gittools/actions/gitversion/execute@v4
    - name: Download NuGet Packages
      uses: actions/download-artifact@v8
      with:
        name: nuget
        path: dist/nuget
    # `commit` is what lets this run from a branch: with no tag of this name yet the action creates one
    # there, which is the tag that no longer has to be made by hand. Where the tag does already exist and
    # carries a release -- an explicit tag build, or a re-run -- allowUpdates keeps that from failing and
    # updates it in place instead, omitBodyDuringUpdate leaves notes written by hand alone, and
    # replacesArtifacts refreshes the packages rather than colliding with the ones already attached.
    - name: Create Release
      if: env.PUBLISH == 'true'
      uses: ncipollo/release-action@v1
      with:
        tag: ${{ steps.GitVersion.outputs.semVer }}
        commit: ${{ github.sha }}
        allowUpdates: true
        omitBodyDuringUpdate: true
        replacesArtifacts: true
        artifacts: dist/nuget/*.nupkg,dist/nuget/*.snupkg
        prerelease: ${{ contains(steps.GitVersion.outputs.semVer, '-') }}
        makeLatest: ${{ !contains(steps.GitVersion.outputs.semVer, '-') }}
        token: ${{ secrets.GITHUB_TOKEN }}
    - name: Push NuGet (GitHub)
      if: github.event_name != 'pull_request'
      shell: pwsh
      run: dotnet nuget push dist/nuget/*.nupkg --source $env:GITHUB_REPOS --api-key $env:GITHUB_TOKEN --skip-duplicate
      env:
        GITHUB_REPOS: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    # Same run, same artifact, both feeds. Gating this on a tag while the GitHub push above runs on
    # every build is what let one version name two different assemblies: GitVersion labels main `pre.N`,
    # which is the shape a release tag also takes, so the tag build re-derives a version GitHub Packages
    # already holds from an earlier main build and skips it as a duplicate -- leaving nuget.org with the
    # tag build and GitHub Packages with the main build under `2.0.0-pre.9`. A consumer restoring from
    # both feeds can then get Apache.Calcite.Data compiled against a Signature that the
    # Apache.Calcite.Extensions beside it does not carry. Publishing from the run that already built the
    # package removes the second build, so there is nothing left to disagree.
    - name: Push NuGet
      if: env.PUBLISH == 'true'
      shell: pwsh
      run: dotnet nuget push dist/nuget/*.nupkg --source $env:NUGET_REPOS --api-key $env:NUGET_TOKEN --skip-duplicate
      env:
        NUGET_REPOS: https://api.nuget.org/v3/index.json
        NUGET_TOKEN: ${{ secrets.NUGET_TOKEN }}
